<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-2 p-0">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse d-flex justify-content-end">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a (click)="authService.logoutUser()" href="javascript:void(0)" class=" fs_10 nav-link">
            <i class="fa fa-sign-out" aria-hidden="true"></i>&nbsp;Logout
          </a>
        </li>        
      </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row">
    @for (item of navItems; track $index) {
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title"><a [routerLink]="item.path">{{item.title}}</a></h2>
          <p class="card-text">{{item.description}}</p>
          <div class="card">
            <ul class="list-group list-group-flush">
              @for (subItem of item.children; track $index) {
              @if(subItem.active){
              <li class="list-group-item">
                <a class="btn btn-sm" [class]="subItem?.color" [routerLink]="item.path+subItem.name">{{subItem.title}}
                </a>
              </li>
              }
              }          
            </ul>
          </div>
        </div>
      </div>
    </div>
    }


  </div>
</div>
