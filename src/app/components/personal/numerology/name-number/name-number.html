<app-header></app-header>
<div class="container">
    <div class="row">
      <div class="col-md-4">
    <mat-radio-group [(ngModel)]="optionToCheck" aria-label="Select an option">
      <mat-radio-button value="name">Name</mat-radio-button>
      <mat-radio-button value="number">Number</mat-radio-button>
    </mat-radio-group>
      </div>
    </div>
    @if(optionToCheck==='name'){
      <div class="row mt-3">
        <div class="col-md-4">
          <label class="w-100">Name Number</label>
          <div class="input-group mb-3">
            <input (keyup.enter)="getNameNumber(name.value)" #name type="text" class="form-control"
              placeholder="Enter name">
            <button (click)="getNameNumber(name.value)" class="input-group-text bg-primary" id="basic-addon2">GO</button>
          </div>
        </div>
      </div>
      @if(totalNo){
      <div class="row">
        <div class="col-md-4 d-flex">
          <label class="me-5">Total: {{totalNo}}</label>
          <label>Sub Total: {{subTotal}}</label>
        </div>
      </div>
      }
    }@else {
      <div class="row mt-3">
        <div class="col-md-4">
          <label class="w-100">Total of Numbers</label>
          <div class="input-group mb-3">
            <input (keyup.enter)="getMobileNo(number.value)" #number type="text" class="form-control" placeholder="Enter number">
            <button (click)="getMobileNo(number.value)" class="input-group-text bg-primary" id="basic-addon2">GO</button>
          </div>
        </div>
      </div>    
      @if(totalOfNumber){
      <div class="row">
        <div class="col-md-4 d-flex">
          <label class="me-5">Total: {{totalOfNumber}}</label>      
        </div>
      </div>
      }
    }


</div>
