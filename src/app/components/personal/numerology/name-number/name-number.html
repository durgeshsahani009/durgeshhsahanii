<app-header></app-header>
<div class="container">
  <div class="row">
    <div class="col-md-4">
      <div class="input-group mb-3">
        <input (keyup.enter)="getNameNumber(name.value)" #name type="text" class="form-control"
          placeholder="Enter name">
        <button (click)="getNameNumber(name.value)" class="input-group-text bg-primary" id="basic-addon2">GO</button>
      </div>
    </div>
  </div>
  @if(totalNo){
  <div class="row">
    <div class="col-md-4 d-flex">
      <label class="me-5">Total: {{totalNo}}</label>
      <label>Sub Total: {{subTotal}}</label>
    </div>
  </div>
  }

  <div class="row mt-3">
    <div class="col-md-4">
      <div class="input-group mb-3">
        <input (keyup.enter)="getMobileNo(number.value)" #number type="text" class="form-control" placeholder="Enter number">
        <button (click)="getMobileNo(number.value)" class="input-group-text bg-primary" id="basic-addon2">GO</button>
      </div>
    </div>
  </div>

  @if(totalOfNumber){
  <div class="row">
    <div class="col-md-4 d-flex">
      <label class="me-5">Total: {{totalOfNumber}}</label>      
    </div>
  </div>
  }

</div>
